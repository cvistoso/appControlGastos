name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ExpenseControl.sln

      - name: Build
        run: dotnet build src/ExpenseControl.Api/ExpenseControl.Api.csproj --no-restore -c Release

      - name: Test
        run: dotnet test tests/ExpenseControl.UnitTests/ExpenseControl.UnitTests.csproj --no-build -c Release --verbosity normal
